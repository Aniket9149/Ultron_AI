<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultron Settings Core</title>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.5);
      --accent-dim: rgba(0, 240, 255, 0.15);
      --success: #00ffaa;
      --danger: #ff3366;
    }

    * {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden !important;
      font-family: 'Oxanium', monospace, sans-serif;
      color: var(--accent);
    }

    .settings-container {
      width: 275px !important;
      padding: 4px 16px 4px 2px !important;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* Cyber Header */
    .cyber-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.4);
      padding-bottom: 4px;
      position: relative;
    }
    .cyber-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: 0;
      width: 35px;
      height: 2px;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .title-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
      text-transform: uppercase;
    }

    .badge-auto {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 1px;
      color: var(--success);
      background: rgba(0, 255, 170, 0.12);
      border: 1px solid rgba(0, 255, 170, 0.4);
      padding: 1px 6px;
      border-radius: 2px;
    }

    /* 3D Hologram Reactor Core Viewport */
    .viewport-3d {
      width: 100%;
      height: 125px;
      background: radial-gradient(circle at 50% 50%, rgba(0, 44, 80, 0.55) 0%, rgba(1, 10, 22, 0.85) 100%);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 5px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.12);
      cursor: grab;
    }
    .viewport-3d:active {
      cursor: grabbing;
    }

    #gyro-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay-tag {
      position: absolute;
      top: 4px;
      left: 7px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 7.5px;
      color: #638cae;
      letter-spacing: 0.8px;
      pointer-events: none;
    }

    .overlay-rot {
      position: absolute;
      bottom: 4px;
      right: 7px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 7.5px;
      color: var(--success);
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    /* Operator Callsign Box */
    .cyber-card {
      background: rgba(0, 22, 44, 0.55);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-left: 2.5px solid var(--success);
      border-radius: 3px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8px;
      font-weight: 700;
      color: #79a4c4;
      letter-spacing: 0.8px;
    }

    .input-row {
      display: flex;
      gap: 5px;
    }

    .callsign-input {
      flex: 1;
      background: rgba(0, 10, 20, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 2px;
      padding: 4px 7px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--success);
      outline: none;
      letter-spacing: 1px;
      user-select: text !important;
    }
    .callsign-input:focus {
      border-color: var(--success);
      box-shadow: 0 0 8px rgba(0, 255, 170, 0.4);
    }

    .save-btn {
      font-family: 'Oxanium', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--success);
      background: rgba(0, 255, 170, 0.12);
      border: 1px solid rgba(0, 255, 170, 0.45);
      padding: 4px 9px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .save-btn:hover {
      background: var(--success);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
    }

    /* Visual Resonance Themes */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .theme-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 2px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s;
    }
    .theme-pill:hover, .theme-pill.active {
      border-color: #fff !important;
      box-shadow: 0 0 10px currentColor !important;
      transform: translateY(-1px);
    }

    /* Toggle Strip */
    .toggle-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 7px;
      background: rgba(0, 16, 32, 0.5);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 2px;
    }

    .toggle-lbl {
      font-size: 8.5px;
      font-weight: 700;
      color: #c7e1f5;
    }

    .toggle-chip {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      cursor: pointer;
      color: var(--success);
      background: rgba(0, 255, 170, 0.1);
      border: 1px solid rgba(0, 255, 170, 0.35);
      transition: all 0.2s;
    }
    .toggle-chip:hover {
      background: var(--success);
      color: #000;
    }

    /* Danger Purge Card */
    .danger-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      background: rgba(35, 8, 16, 0.5);
      border: 1px solid rgba(255, 51, 102, 0.35);
      border-radius: 2px;
    }

    .danger-title {
      font-size: 8.5px;
      font-weight: 700;
      color: #ff6688;
      letter-spacing: 0.6px;
    }

    .purge-btn {
      font-family: 'Oxanium', sans-serif;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--danger);
      background: rgba(255, 51, 102, 0.15);
      border: 1px solid var(--danger);
      padding: 3px 9px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .purge-btn:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.7);
    }

    /* Live Output Ticker */
    .status-ticker {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      color: #7ba3bf;
      background: rgba(0, 8, 16, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.18);
      border-radius: 2px;
      padding: 4px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="settings-container">
    <!-- Header -->
    <div class="cyber-header">
      <span class="title-text">// System Calibration</span>
      <span class="badge-auto">CONFIG CORE</span>
    </div>

    <!-- 3D Holographic Gyroscope Viewport -->
    <div class="viewport-3d" id="viewport-box">
      <canvas id="gyro-canvas"></canvas>
      <div class="overlay-tag">HARMONIC CORE // MK-VIII</div>
      <div class="overlay-rot" id="core-status">SYNC: 60 FPS</div>
    </div>

    <!-- Callsign & Operator Authentication -->
    <div class="cyber-card">
      <div class="card-meta">
        <span>OPERATOR IDENTITY</span>
        <span style="color:#00ffaa;" id="save-status">SAVED</span>
      </div>
      <div class="input-row">
        <input type="text" id="op-input" class="callsign-input" value="Aniket" placeholder="Callsign...">
        <button class="save-btn" onclick="saveCallsign()">SAVE</button>
      </div>
    </div>

    <!-- Visual Spectra Theme Pills -->
    <div class="theme-grid">
      <div class="theme-pill active" id="th-cyan" style="color:#00f0ff; background:rgba(0,240,255,0.12);" onclick="setTheme('CYAN', '#00f0ff')">CYAN</div>
      <div class="theme-pill" id="th-amber" style="color:#ffaa00; background:rgba(255,170,0,0.12);" onclick="setTheme('AMBER', '#ffaa00')">AMBER</div>
      <div class="theme-pill" id="th-crimson" style="color:#ff3366; background:rgba(255,51,102,0.12);" onclick="setTheme('CRIMSON', '#ff3366')">CRIMSON</div>
      <div class="theme-pill" id="th-matrix" style="color:#00ffaa; background:rgba(0,255,170,0.12);" onclick="setTheme('MATRIX', '#00ffaa')">MATRIX</div>
    </div>

    <!-- Persona Modulator -->
    <div class="toggle-strip">
      <span class="toggle-lbl">NEURAL PERSONA</span>
      <span class="toggle-chip" id="persona-btn" onclick="togglePersona()">ULTRON MK-I</span>
    </div>

    <!-- Data Vault Danger Purge -->
    <div class="danger-strip">
      <span class="danger-title">Wipe Memory Vault</span>
      <button class="purge-btn" onclick="purgeMemory()">PURGE</button>
    </div>

    <!-- Console Stream -->
    <div class="status-ticker" id="ticker-log">
      &gt; CONFIG READY // CALIBRATION ENGAGED
    </div>
  </div>

  <script>
    // 1. Pure Mathematics 3D Canvas Wireframe Engine (Zero External Dependencies, 0% Crash Risk)
    const canvas = document.getElementById('gyro-canvas');
    const ctx = canvas.getContext('2d');
    let themeColor = '#00f0ff';

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let rotX = 0.4;
    let rotY = 0.2;
    let rotZ = 0;
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    const vpBox = document.getElementById('viewport-box');
    vpBox.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      rotY += dx * 0.02;
      rotX += dy * 0.02;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    // 3D Point Projection Helper
    function project(x, y, z, cx, cy) {
      // Rotation around X
      let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
      let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);

      // Rotation around Y
      let x2 = x * Math.cos(rotY) + z1 * Math.sin(rotY);
      let z2 = -x * Math.sin(rotY) + z1 * Math.cos(rotY);

      // Perspective Scale
      const fov = 140;
      const scale = fov / (fov + z2 + 80);
      return {
        x: cx + x2 * scale,
        y: cy + y1 * scale,
        scale: scale,
        z: z2
      };
    }

    // Floating Quantum Particles
    const particles = [];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: (Math.random() - 0.5) * 80,
        y: (Math.random() - 0.5) * 80,
        z: (Math.random() - 0.5) * 80,
        speed: 0.01 + Math.random() * 0.02
      });
    }

    function render3D() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Auto-rotation when not dragging
      if (!isDragging) {
        rotY += 0.018;
        rotX += 0.008;
      }

      // Draw Outer Gyroscope Ring
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 1.3;
      ctx.shadowColor = themeColor;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      const ringSteps = 36;
      const ringRadius = 42;
      for (let i = 0; i <= ringSteps; i++) {
        const theta = (i / ringSteps) * Math.PI * 2;
        const px = Math.cos(theta) * ringRadius;
        const pz = Math.sin(theta) * ringRadius;
        const pt = project(px, 0, pz, cx, cy);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Draw Inner Perpendicular Gimbal Ring
      ctx.strokeStyle = '#00ffaa';
      ctx.lineWidth = 1;
      ctx.shadowColor = '#00ffaa';
      ctx.beginPath();
      const innerRadius = 30;
      for (let i = 0; i <= ringSteps; i++) {
        const theta = (i / ringSteps) * Math.PI * 2;
        const py = Math.cos(theta) * innerRadius;
        const pz = Math.sin(theta) * innerRadius;
        const pt = project(0, py, pz, cx, cy);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Draw Center Rotating Octahedron Core
      const coreSize = 14;
      const vertices = [
        { x: 0, y: -coreSize, z: 0 },
        { x: coreSize, y: 0, z: 0 },
        { x: 0, y: 0, z: coreSize },
        { x: -coreSize, y: 0, z: 0 },
        { x: 0, y: 0, z: -coreSize },
        { x: 0, y: coreSize, z: 0 }
      ];

      const edges = [
        [0, 1], [0, 2], [0, 3], [0, 4],
        [5, 1], [5, 2], [5, 3], [5, 4],
        [1, 2], [2, 3], [3, 4], [4, 1]
      ];

      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 1.2;
      ctx.shadowBlur = 6;
      edges.forEach(edge => {
        const p1 = project(vertices[edge[0]].x, vertices[edge[0]].y, vertices[edge[0]].z, cx, cy);
        const p2 = project(vertices[edge[1]].x, vertices[edge[1]].y, vertices[edge[1]].z, cx, cy);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      });

      // Draw Quantum Particles
      ctx.fillStyle = themeColor;
      particles.forEach(p => {
        const pt = project(p.x, p.y, p.z, cx, cy);
        if (pt.scale > 0) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, Math.max(1, 1.8 * pt.scale), 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.shadowBlur = 0;

      requestAnimationFrame(render3D);
    }
    render3D();

    // 2. Logic Triggers
    function setLog(msg, isAlert = false) {
      const el = document.getElementById('ticker-log');
      el.innerText = `> ${msg}`;
      el.style.color = isAlert ? '#ff3366' : '#00ffaa';
      setTimeout(() => { el.style.color = '#7ba3bf'; }, 3500);
    }

    function saveCallsign() {
      const val = document.getElementById('op-input').value.trim() || 'COMMANDER';
      localStorage.setItem('ultron_operator_name', val);
      document.getElementById('save-status').innerText = 'COMMITTED';
      setLog(`OPERATOR CALLSIGN COMMITTED: [${val}]`);
    }

    function setTheme(name, hex) {
      document.querySelectorAll('.theme-pill').forEach(p => p.classList.remove('active'));
      const activeEl = document.getElementById('th-' + name.toLowerCase());
      if (activeEl) activeEl.classList.add('active');

      themeColor = hex;
      setLog(`THEME HARMONIC SHIFT -> ${name}`);
    }

    let isUltron = true;
    function togglePersona() {
      isUltron = !isUltron;
      const b = document.getElementById('persona-btn');
      b.innerText = isUltron ? 'ULTRON MK-I' : 'JARVIS CORE';
      setLog(`AI PERSONA -> ${b.innerText}`);
    }

    function purgeMemory() {
      if (confirm("DIRECTIVE: Wipe all cached vector memory and chat history?")) {
        localStorage.clear();
        document.getElementById('op-input').value = 'COMMANDER';
        setLog("MEMORY VAULT PURGED // ZEROED", true);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('ultron_operator_name');
      if (saved) document.getElementById('op-input').value = saved;
    });
  </script>
</body>
</html>
