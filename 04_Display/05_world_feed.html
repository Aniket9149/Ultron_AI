<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Consolas, monospace; }
  body { background:#010612; width:100vw; height:100vh; overflow:hidden; border:1px solid rgba(0,229,255,0.3); }
  #canvas-container { position:absolute; inset:0; z-index:1; }
  .hud-overlay {
    position:absolute; inset:0; z-index:2; pointer-events:none; padding:10px 14px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .tag { font-size:9px; letter-spacing:2px; color:#00e5ff; font-weight:bold; }
  .node-panel { display:flex; justify-content:space-between; }
  .card {
    background:rgba(0,229,255,0.06); border:1px solid rgba(0,229,255,0.3);
    border-radius:3px; padding:4px 8px; text-align:center; min-width:75px;
    backdrop-filter:blur(4px);
  }
  .city { font-size:8px; color:#fff; letter-spacing:1px; }
  .val { font-size:12px; font-weight:bold; color:#00e5ff; text-shadow:0 0 6px #00e5ff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud-overlay">
    <div class="tag">// 3D PLANETARY SENSOR CLUSTER //</div>
    <div class="node-panel">
      <div class="card"><div class="city">TOKYO</div><div class="val" id="n1">99.8%</div></div>
      <div class="card"><div class="city">BERLIN</div><div class="val" id="n2">98.9%</div></div>
      <div class="card"><div class="city">VIRGINIA</div><div class="val" id="n3">100%</div></div>
      <div class="card"><div class="city">MUMBAI</div><div class="val" id="n4">99.7%</div></div>
    </div>
  </div>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 45;
    const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const globeGeom = new THREE.IcosahedronGeometry(15, 2);
    const globeMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent:true, opacity:0.35 });
    const globe = new THREE.Mesh(globeGeom, globeMat);
    scene.add(globe);

    const partGeom = new THREE.BufferGeometry();
    const pos = [];
    for(let i=0; i<60; i++) {
      const u = Math.random(), v = Math.random();
      const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
      const r = 16.5;
      pos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
    }
    partGeom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const partMat = new THREE.PointsMaterial({ color: 0x00ffaa, size: 1.5, transparent:true, opacity:0.8 });
    const particles = new THREE.Points(partGeom, partMat);
    scene.add(particles);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += 0.008; globe.rotation.x += 0.004;
      particles.rotation.y += 0.012; particles.rotation.x -= 0.005;
      renderer.render(scene, camera);
    }
    animate();

    setInterval(() => {
      document.getElementById('n1').innerText = (99.1 + Math.random()*0.8).toFixed(1) + '%';
      document.getElementById('n2').innerText = (98.2 + Math.random()*0.9).toFixed(1) + '%';
      document.getElementById('n4').innerText = (99.4 + Math.random()*0.5).toFixed(1) + '%';
    }, 1500);
  </script>
</body>
</html>
