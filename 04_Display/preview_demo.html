<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultron OS - 8K Large Spatial HUD Sandbox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #010307;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, monospace;
    }

    #master-hologram-slab {
      position: absolute;
      inset: 4px;
      border-radius: 6px;
      background: #02050d;
      border: 1px solid rgba(0, 229, 255, 0.3);
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 0 120px rgba(0, 140, 255, 0.1),
        0 25px 80px rgba(0, 0, 0, 0.98);
      overflow: hidden;
    }

    #vfx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .cinema-matrix-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at 50% 43%, rgba(0,0,0,1) 35%, rgba(0,0,0,0.2) 85%);
      -webkit-mask-image: radial-gradient(circle at 50% 43%, rgba(0,0,0,1) 35%, rgba(0,0,0,0.2) 85%);
      z-index: 2;
    }

    .optical-flare-core {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 43%;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(0, 150, 255, 0.05) 20%, 
        rgba(0, 229, 255, 0.45) 42%, 
        rgba(255, 255, 255, 0.95) 50%, 
        rgba(0, 229, 255, 0.45) 58%, 
        rgba(0, 150, 255, 0.05) 80%, 
        transparent 100%
      );
      box-shadow: 
        0 0 20px rgba(0, 229, 255, 0.85),
        0 0 50px rgba(0, 140, 255, 0.45);
      pointer-events: none;
      z-index: 2;
      opacity: 0.85;
    }

    .cinematic-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(1, 3, 7, 0.8) 100%);
      box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.95);
    }

    .slab-etched-layout {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .hud-element {
      position: absolute;
      background: transparent !important;
      mix-blend-mode: screen;
    }

    .viewport-scaler {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
    }

    iframe {
      border: none;
      background: transparent !important;
      display: block;
      overflow: hidden;
    }

    .sandbox-tag {
      position: fixed; bottom: 12px; left: 16px; z-index: 1000;
      font-size: 7.5px; letter-spacing: 2.5px; color: #00ffaa;
      background: rgba(0, 255, 170, 0.08); border: 1px solid rgba(0, 255, 170, 0.4);
      padding: 3px 9px; border-radius: 2px; pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="sandbox-tag">● 8K LARGE SCALE // ORIGINAL SYNAPTIC SPHERE RESTORED</div>

  <div id="master-hologram-slab">
    <canvas id="vfx-canvas"></canvas>

    <div class="optical-flare-core"></div>
    <div class="cinema-matrix-grid"></div>

    <svg class="slab-etched-layout" width="100%" height="100%">
      <defs>
        <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="rgba(0, 229, 255, 0.35)" />
          <stop offset="50%" stop-color="rgba(0, 180, 255, 0.08)" />
          <stop offset="100%" stop-color="rgba(0, 229, 255, 0.25)" />
        </linearGradient>
      </defs>

      <!-- Left Wing Framing -->
      <rect x="14" y="14" width="490" height="970" rx="4" fill="none" stroke="url(#edgeGlow)" stroke-width="1" />
      <line x1="210" y1="14" x2="210" y2="984" stroke="rgba(0, 229, 255, 0.08)" stroke-width="1" />
      
      <!-- Right Wing Telemetry Enclosure -->
      <rect x="calc(100% - 315px)" y="14" width="300" height="840" rx="4" fill="none" stroke="url(#edgeGlow)" stroke-width="1" />

      <!-- Center Quantum Singularity Containment Ring -->
      <circle cx="50%" cy="43%" r="395" fill="none" stroke="rgba(0, 229, 255, 0.09)" stroke-width="1" stroke-dasharray="8 8" />
      <circle cx="50%" cy="43%" r="422" fill="none" stroke="rgba(0, 229, 255, 0.04)" stroke-width="0.75" />

      <!-- Center Dock Laser Track -->
      <line x1="490" y1="785" x2="1430" y2="785" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1" stroke-dasharray="16 8" />
    </svg>

    <div class="cinematic-vignette"></div>
  </div>

  <script>
    // 1. Procedural 8K Cinematic Nebula
    const canvas = document.getElementById('vfx-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 110; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 1.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    let time = 0;
    function renderAtmosphere() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width * 0.5;
      const cy = canvas.height * 0.43;

      const grad1 = ctx.createRadialGradient(cx, cy, 40, cx, cy, 550);
      grad1.addColorStop(0, 'rgba(0, 160, 255, 0.18)');
      grad1.addColorStop(0.35, 'rgba(8, 38, 75, 0.12)');
      grad1.addColorStop(0.7, 'rgba(4, 14, 30, 0.04)');
      grad1.addColorStop(1, 'transparent');
      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const pulseRadius = 380 + Math.sin(time * 1.5) * 25;
      const gradPulse = ctx.createRadialGradient(cx, cy, 10, cx, cy, pulseRadius);
      gradPulse.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
      gradPulse.addColorStop(0.2, 'rgba(0, 229, 255, 0.09)');
      gradPulse.addColorStop(1, 'transparent');
      ctx.fillStyle = gradPulse;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.alpha += Math.sin(time * 3 + p.radius) * 0.005;
        if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 229, 255, ${Math.max(0.1, Math.min(0.7, p.alpha))})`;
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = p.radius > 1 ? 6 : 0;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      time += 0.012;
      requestAnimationFrame(renderAtmosphere);
    }
    renderAtmosphere();

        // 2. Production Master Navigation Listener (Strict Route Matching)
        window.openSettingsModal = function() {
      const overlay = document.getElementById('settings-overlay-frame');
      if (overlay) {
        overlay.style.display = 'block';
        overlay.src = 'preview_settings_page.html?t=' + Date.now();
      }
    };

    window.closeSettingsModal = function() {
      const overlay = document.getElementById('settings-overlay-frame');
      if (overlay) overlay.style.display = 'none';
    };

                window.addEventListener('message', (e) => {
      if (!e.data || !e.data.target) return;
      const target = String(e.data.target).toUpperCase();
      const deckIframe = document.getElementById('deck-target-iframe');
      if (!deckIframe) return;

      console.log("[ULTRON HUD NAV] Loading:", target);

      if (target.includes('SETTING')) {
        deckIframe.src = 'preview_settings.html';
      } else if (target.includes('TOOL')) {
        deckIframe.src = 'preview_tools.html';
      } else if (target.includes('NETWORK') || target.includes('NET')) {
        deckIframe.src = 'preview_network.html';
      } else if (target.includes('SYSTEM') || target.includes('SYS')) {
        deckIframe.src = 'preview_systems.html';
      } else if (target.includes('MEMORY') || target.includes('MEM')) {
        deckIframe.src = 'preview_memory_graph.html';
      } else if (target.includes('INTELLIGENCE') || target.includes('INTEL')) {
        deckIframe.src = 'preview_intelligence.html';
      } else if (target.includes('AGENT')) {
        deckIframe.src = 'preview_cyber_brain.html';
      } else if (target.includes('HOME')) {
        deckIframe.src = '../component_cards.html';
      }
    });

    // Also attach directly to sidebar iframe once loaded
    window.addEventListener('DOMContentLoaded', () => {
      const checkSidebar = setInterval(() => {
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach(f => {
          try {
            const doc = f.contentDocument || f.contentWindow.document;
            if (doc) {
              const buttons = doc.querySelectorAll('button, .nav-btn, .nav-item, div, span, a');
              buttons.forEach(b => {
                if ((b.innerText || '').toUpperCase().includes('SETTING') && !b.dataset.settingBound) {
                  b.dataset.settingBound = 'true';
                  b.addEventListener('click', (ev) => {
                    console.log("[DIRECT ATTACH] Settings button clicked inside iframe!");
                    window.openSettingsModal();
                  }, true);
                }
              });
            }
          } catch(err) {}
        });
      }, 1000);
    });// 3. Fully Scaled Large-Screen Coordinates (Full Canvas Coverage)
    const SEAMLESS_MODULES = [
      // Left Column (Sidebar, Globe, and Reactive Cards Deck)
      { id: "sidebar_sandbox.html",          w: 380, h: 1020, scale: 0.78, x: 16,  y: 16, z: 20, useRight: false },
      { id: "../component_globe_3d.html",    w: 480, h: 600,  scale: 0.50, x: 220, y: 16,  z: 12, useRight: false },
      { id: "../component_cards.html",       w: 340, h: 620, scale: 0.85, x: 220, y: 312, z: 12, useRight: false, iframeId: "deck-target-iframe" },

      // Center Stage (Blender Core + System Dock)
      { id: "../component_center_core.html", w: 900, h: 800,  scale: 0.94, x: 475, y: 15,  z: 5,  useRight: false },
      { id: "../component_center_dock.html", w: 900, h: 160,  scale: 0.78, x: 575, y: 730, z: 25, useRight: false },

      // Right Wing Telemetry
      { id: "../01_time_deck.html",          w: 400, h: 170,  scale: 0.71, right: 18, y: 16,  z: 10, useRight: true },
      { id: "../02_system_vitals.html",      w: 400, h: 210,  scale: 0.71, right: 18, y: 146, z: 10, useRight: true },
      { id: "../03_neural_activity.html",    w: 400, h: 220,  scale: 0.71, right: 18, y: 304, z: 10, useRight: true },
      { id: "../04_mission_log.html",        w: 400, h: 210,  scale: 0.71, right: 18, y: 468, z: 10, useRight: true },
      { id: "../05_world_feed.html",         w: 400, h: 170,  scale: 0.71, right: 18, y: 624, z: 10, useRight: true }
    ];

    const slab = document.getElementById('master-hologram-slab');

    SEAMLESS_MODULES.forEach(mod => {
      const el = document.createElement('div');
      el.className = 'hud-element';
      el.style.zIndex = mod.z;

      const sW = Math.round(mod.w * mod.scale);
      const sH = Math.round(mod.h * mod.scale);
      el.style.width = sW + 'px';
      el.style.height = sH + 'px';
      el.style.top = mod.y + 'px';

      if (mod.useRight) {
        el.style.right = mod.right + 'px';
      } else {
        el.style.left = mod.x + 'px';
      }

      const scaler = document.createElement('div');
      scaler.className = 'viewport-scaler';
      scaler.style.transform = `scale(${mod.scale})`;

      const ifr = document.createElement('iframe');
      ifr.src = mod.id;
      if (mod.iframeId) ifr.id = mod.iframeId;
      ifr.scrolling = 'no';
      ifr.style.width = mod.w + 'px';
      ifr.style.height = mod.h + 'px';

      scaler.appendChild(ifr);
      el.appendChild(scaler);
      slab.appendChild(el);
    });
  </script>
<iframe id="settings-overlay-frame" src="preview_settings_page.html" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; border:none; z-index:999999; background:transparent;"></iframe>
</body>
</html>
