<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body {
    background: radial-gradient(circle at 50% 50%, rgba(0, 35, 75, 0.3) 0%, #010612 100%);
    width: 100vw; height: 100vh; overflow: hidden; padding: 10px 14px;
    border: 1px solid rgba(0, 229, 255, 0.35); display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.08);
  }
  .hud-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 8px; letter-spacing: 2.5px; color: #00e5ff; font-weight: 800;
    border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 4px;
  }
  .pulse-node {
    width: 6px; height: 6px; border-radius: 50%; background: #00ffaa;
    box-shadow: 0 0 10px #00ffaa; animation: radarPing 1.2s infinite ease-out;
  }
  @keyframes radarPing { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }

  /* 3 Dial Holographic Gauges */
  .gauges-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0;
  }
  .gauge-card {
    background: rgba(0, 229, 255, 0.04); border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 4px; padding: 6px; display: flex; flex-direction: column; align-items: center; position: relative;
  }
  .dial-box { width: 56px; height: 56px; position: relative; }
  .dial-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(0, 229, 255, 0.12); stroke-width: 4.5; }
  .ring-val {
    fill: none; stroke-width: 4.5; stroke-dasharray: 157; stroke-dashoffset: 40;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .val-cyan { stroke: #00e5ff; filter: drop-shadow(0 0 6px #00e5ff); }
  .val-amber { stroke: #ffaa00; filter: drop-shadow(0 0 6px #ffaa00); }
  .val-emerald { stroke: #00ffaa; filter: drop-shadow(0 0 6px #00ffaa); }

  .dial-center-text {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff;
  }
  .gauge-label {
    font-size: 8px; letter-spacing: 1px; color: rgba(255, 255, 255, 0.7);
    margin-top: 4px; font-weight: 700; text-align: center;
  }

  /* Micro status wave bars */
  .telemetry-strip {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0, 229, 255, 0.05); border: 1px solid rgba(0, 229, 255, 0.18);
    padding: 4px 8px; border-radius: 3px; font-size: 8px; color: #7ad7ff; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="hud-head">
    <div style="display:flex; align-items:center; gap:6px;">
      <div class="pulse-node"></div>
      <span>QUANTUM HARMONICS // VITALS MK-VIII</span>
    </div>
    <span style="color:#00ffaa;">EQUILIBRIUM LOCKED</span>
  </div>

  <div class="gauges-row">
    <!-- Gauge 1: Neural Compute -->
    <div class="gauge-card">
      <div class="dial-box">
        <svg viewBox="0 0 60 60">
          <circle class="ring-bg" cx="30" cy="30" r="25"/>
          <circle id="r1" class="ring-val val-cyan" cx="30" cy="30" r="25"/>
        </svg>
        <div class="dial-center-text" id="t1">52%</div>
      </div>
      <div class="gauge-label">NEURAL LOAD</div>
    </div>

    <!-- Gauge 2: Core Entropy -->
    <div class="gauge-card">
      <div class="dial-box">
        <svg viewBox="0 0 60 60">
          <circle class="ring-bg" cx="30" cy="30" r="25"/>
          <circle id="r2" class="ring-val val-amber" cx="30" cy="30" r="25"/>
        </svg>
        <div class="dial-center-text" id="t2">74%</div>
      </div>
      <div class="gauge-label">ENTROPY FLUX</div>
    </div>

    <!-- Gauge 3: Shield Stability -->
    <div class="gauge-card">
      <div class="dial-box">
        <svg viewBox="0 0 60 60">
          <circle class="ring-bg" cx="30" cy="30" r="25"/>
          <circle id="r3" class="ring-val val-emerald" cx="30" cy="30" r="25"/>
        </svg>
        <div class="dial-center-text" id="t3">98%</div>
      </div>
      <div class="gauge-label">SHIELD COH</div>
    </div>
  </div>

  <div class="telemetry-strip">
    <span>REACTOR: <b>4.2 K</b></span>
    <span>CONTAINMENT: <b>14.8 T</b></span>
    <span>THROUGHPUT: <b style="color:#00ffaa;">1.4 TB/s</b></span>
  </div>

  <script>
    const circ = 2 * Math.PI * 25; // ~157.08
    ['r1','r2','r3'].forEach(id => {
      document.getElementById(id).style.strokeDasharray = circ;
    });

    function setGauge(ringId, textId, pct) {
      const ring = document.getElementById(ringId);
      const text = document.getElementById(textId);
      ring.style.strokeDashoffset = circ - (circ * pct / 100);
      text.innerText = Math.round(pct) + '%';
    }

    function refresh() {
      const g1 = 45 + Math.random() * 20;
      const g2 = 68 + Math.random() * 16;
      const g3 = 94 + Math.random() * 5;
      setGauge('r1', 't1', g1);
      setGauge('r2', 't2', g2);
      setGauge('r3', 't3', g3);
    }
    setInterval(refresh, 1400);
    refresh();
  </script>
</body>
</html>
