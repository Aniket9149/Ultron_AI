<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON // CINEMATIC SIDEBAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=Michroma&family=Syncopate:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #030508;
            --glass-card: rgba(8, 14, 24, 0.70);
            --glass-border: rgba(140, 210, 255, 0.22);
            --cyan-glow: #00f0ff;
            --text-pure: #ffffff;
            --text-muted: #8298b4;
            --font-display: 'Syncopate', sans-serif;
            --font-title: 'Michroma', sans-serif;
            --font-cyber: 'Oxanium', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-void);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-left: 40px;
            font-family: var(--font-cyber);
            color: var(--text-pure);
        }

        .ultron-sidebar {
            width: 230px;
            height: 92vh;
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 0 1px 1px rgba(255, 255, 255, 0.08), 0 0 25px rgba(0, 240, 255, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 16px;
            position: relative;
        }

        .brand-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .brand-glyph {
            width: 42px;
            height: 42px;
            filter: drop-shadow(0 0 8px #00f0ff) drop-shadow(0 0 16px rgba(0, 240, 255, 0.8));
            margin-bottom: 8px;
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: 16.91px; /* 0.5% scale reduction */
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(180deg, #ffffff 20%, #67e8f9 80%, #00f0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 18px rgba(0, 240, 255, 0.5));
            margin-left: 8px;
        }

        .brand-subtitle {
            font-family: var(--font-mono);
            font-size: 7.76px; /* 0.5% scale reduction */
            letter-spacing: 3.5px;
            color: var(--cyan-glow);
            text-shadow: 0 0 6px #00f0ff, 0 0 14px rgba(0, 240, 255, 0.8), 0 0 22px rgba(0, 240, 255, 0.5);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-subtitle::before, .brand-subtitle::after {
            content: '';
            width: 12px;
            height: 1px;
            background: rgba(0, 240, 255, 0.6);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.9);
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin: 18px 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 9px 13px;
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }

        .nav-link svg {
            width: 15px;
            height: 15px;
            stroke-width: 1.8;
            stroke: currentColor;
            flex-shrink: 0;
            margin-right: 12px;
            transition: all 0.2s;
        }

        .nav-text {
            font-family: var(--font-title);
            font-size: 10.15px; /* 0.5% scale reduction */
            letter-spacing: 2px;
            text-transform: uppercase;
            flex: 1;
            transition: all 0.25s ease;
        }

        .nav-index {
            font-family: var(--font-mono);
            font-size: 7.56px; /* 0.5% scale reduction */
            color: #43556d;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.25);
            transform: translateX(3px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.12);
        }

        .nav-link:hover .nav-text {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 14px rgba(0, 240, 255, 0.5);
        }

        .nav-link:hover svg {
            stroke: var(--cyan-glow);
            filter: drop-shadow(0 0 6px var(--cyan-glow));
        }

        .nav-link.active {
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.22) 0%, rgba(0, 240, 255, 0.05) 100%);
            border: 1px solid rgba(0, 240, 255, 0.55);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.32), inset 0 0 14px rgba(0, 240, 255, 0.18);
        }

        .nav-link.active svg {
            stroke: var(--cyan-glow);
            filter: drop-shadow(0 0 8px var(--cyan-glow));
        }

        .nav-link.active .nav-text {
            background: linear-gradient(180deg, #ffffff 30%, #00f0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 16px rgba(0, 240, 255, 0.6));
        }

        .nav-link.active .nav-index {
            color: var(--cyan-glow);
            text-shadow: 0 0 8px var(--cyan-glow), 0 0 16px var(--cyan-glow);
        }

        .sidebar-footer {
            padding: 14px 6px 2px 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .footer-quote {
            font-family: var(--font-mono);
            font-size: 7.96px; /* 0.5% scale reduction */
            line-height: 1.6;
            color: #7086a2;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.35);
        }

        .footer-author {
            font-family: var(--font-display);
            margin-top: 5px;
            font-size: 7.56px; /* 0.5% scale reduction */
            letter-spacing: 3px;
            color: var(--cyan-glow);
            text-shadow: 0 0 8px var(--cyan-glow), 0 0 16px rgba(0, 240, 255, 0.8), 0 0 24px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>
    <aside class="ultron-sidebar">
        <div class="brand-block">
            <svg class="brand-glyph" viewBox="0 0 32 32" fill="none">
                <polygon points="16 3 6 10 16 17 26 10" stroke="#00f0ff" stroke-width="2" stroke-linejoin="round"/>
                <polyline points="6 22 16 29 26 22" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="6 16 16 23 26 16" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="brand-title">ULTRON</div>
            <div class="brand-subtitle">AI // PROTOCOL 6.0</div>
        </div>

        <nav class="nav-list">
            <div class="nav-link active" onclick="selectItem(this)">
                <svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="nav-text">Home</span>
                <span class="nav-index">01</span>
            </div>
            <div class="nav-link" onclick="selectItem(this)">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/></svg>
                <span class="nav-text">Intelligence</span>
                <span class="nav-index">02</span>
            </div>
            <div class="nav-link" onclick="selectItem(this)">
                <svg viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                <span class="nav-text">Agents</span>
                <span class="nav-index">03</span>
            </div>
            <div class="nav-link" onclick="selectItem(this)">
                <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg>
                <span class="nav-text">Memory</span>
                <span class="nav-index">04</span>
            </div>
            <div class="nav-link" onclick="selectItem(this)">
                <svg viewBox="0 0 24 24" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                <span class="nav-text">Systems</span>
                <span class="nav-index">05</span>
            </div>
            <div class="nav-link" onclick="selectItem(this)">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
                <span class="nav-text">Network</span>
                <span class="nav-index">06</span>
            </div>
            <div class="nav-link" onclick="selectItem(this)">
                <svg viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                <span class="nav-text">Tools</span>
                <span class="nav-index">07</span>
            </div>
            <div class="nav-link" onclick="selectItem(this)">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span class="nav-text">Settings</span>
                <span class="nav-index">08</span>
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="footer-quote">"SOME WATCH THE WORLD. I CALCULATE ITS END."</div>
            <div class="footer-author">— ULTRON OS</div>
        </div>
    </aside>

    <script>
        function selectItem(el) {
            document.querySelectorAll('.nav-link').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
