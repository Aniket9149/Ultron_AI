<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Consolas, monospace;
    user-select: none;
    -webkit-font-smoothing: subpixel-antialiased;
    text-rendering: geometricPrecision;
  }
  html, body {
    background: transparent !important;
    width: 340px;
    height: 620px;
    overflow: hidden;
    color: #fff;
    padding: 0 4px;
  }

  #memory-root {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    animation: holoProject 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  @keyframes holoProject {
    from { opacity: 0; transform: scale(0.96); filter: blur(3px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  .holo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(0, 229, 255, 0.35);
    padding-bottom: 5px;
    margin-bottom: 4px;
    flex-shrink: 0;
    max-width: 330px;
  }
  .holo-header-title {
    font-size: 11px;
    letter-spacing: 2.5px;
    font-weight: 900;
    color: #00f0ff;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.9);
  }
  .holo-tag {
    font-size: 8px;
    letter-spacing: 1px;
    color: #00ffaa;
    font-weight: 900;
    background: rgba(0, 255, 170, 0.15);
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid rgba(0, 255, 170, 0.5);
    box-shadow: 0 0 8px rgba(0, 255, 170, 0.4);
  }

  .memory-stage {
    width: 330px;
    height: 220px;
    position: relative;
    flex-shrink: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.22) 0%, rgba(1, 8, 22, 0.95) 75%, #000 100%);
    border: 1px solid rgba(0, 229, 255, 0.5);
    border-radius: 4px;
    box-shadow: inset 0 0 50px rgba(0, 180, 255, 0.35), 0 0 15px rgba(0, 229, 255, 0.2);
    overflow: hidden;
  }
  #knowledge-graph-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .memory-stage::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
    background-size: 100% 4px;
    pointer-events: none;
    opacity: 0.35;
  }

  .memory-telemetry-viewport {
    flex: 1;
    max-height: 340px;
    overflow-y: scroll;
    overflow-x: hidden;
    padding-right: 6px;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    scroll-behavior: smooth;
    max-width: 330px;
  }

  .memory-telemetry-viewport::-webkit-scrollbar { width: 3px; }
  .memory-telemetry-viewport::-webkit-scrollbar-track { background: rgba(0, 229, 255, 0.05); }
  .memory-telemetry-viewport::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #00ffaa, #00f0ff);
    border-radius: 2px;
    box-shadow: 0 0 8px #00f0ff;
  }

  .cluster-card {
    display: flex;
    flex-direction: column;
    padding: 7px 10px;
    border-left: 3px solid #00f0ff;
    background: linear-gradient(90deg, rgba(0, 229, 255, 0.07) 0%, rgba(0, 229, 255, 0.01) 100%);
    border-bottom: 1px solid rgba(0, 229, 255, 0.15);
    border-radius: 0 3px 3px 0;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .cluster-card:hover {
    border-left-color: #00ffaa;
    background: linear-gradient(90deg, rgba(0, 255, 170, 0.14) 0%, rgba(0, 255, 170, 0.02) 100%);
    transform: translateX(4px);
  }

  .cluster-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cluster-name-wrap {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .pulse-node {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00ffaa;
    box-shadow: 0 0 10px #00ffaa;
  }
  .cluster-name {
    font-size: 12.5px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffffff;
    font-family: 'Consolas', monospace;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.85);
  }

  .cluster-meta-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cluster-status {
    font-size: 9px;
    font-weight: 900;
    color: #00ffaa;
    letter-spacing: 1.5px;
  }
  .cluster-metric {
    font-size: 10px;
    color: #00e5ff;
    font-family: 'Consolas', monospace;
    font-weight: 800;
  }
  .cluster-desc {
    font-size: 9.5px;
    letter-spacing: 0.8px;
    color: rgba(220, 245, 255, 0.9);
    margin-top: 2px;
    font-weight: 700;
  }
  .cluster-vector-stat {
    font-size: 8px;
    letter-spacing: 1.2px;
    color: #7ee8ff;
    font-family: 'Consolas', monospace;
    margin-top: 2px;
    font-weight: 700;
  }
</style>
</head>
<body>

  <div id="memory-root">
    <div class="holo-header">
      <span class="holo-header-title">// VECTOR KNOWLEDGE GRAPH</span>
      <span class="holo-tag">● 1.2M EMBEDDINGS</span>
    </div>

    <div class="memory-stage">
      <canvas id="knowledge-graph-canvas"></canvas>
    </div>

    <div class="memory-telemetry-viewport" id="telemetry-roster"></div>
  </div>

  <script>
    const cvs = document.getElementById('knowledge-graph-canvas');
    const ctx = cvs.getContext('2d', { alpha: true });

    let dpr = window.devicePixelRatio || 2;
    function setupCanvas() {
      const rect = cvs.getBoundingClientRect();
      cvs.width = Math.round(rect.width * dpr);
      cvs.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', setupCanvas);
    setupCanvas();

    const CLUSTER_CENTERS = [
      { id: 0, x: 0, y: -4, z: 0, color: 'cyan' },
      { id: 1, x: -42, y: 14, z: -14, color: 'blue' },
      { id: 2, x: 42, y: -10, z: 16, color: 'green' }
    ];

    const GRAPH_NODES = [];
    const TOTAL_NODES = 110;

    for (let i = 0; i < TOTAL_NODES; i++) {
      const clusterIdx = i < 45 ? 0 : (i < 80 ? 1 : 2);
      const c = CLUSTER_CENTERS[clusterIdx];

      const r = 10 + Math.random() * 34;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      GRAPH_NODES.push({
        cluster: clusterIdx,
        baseX: c.x + r * Math.sin(phi) * Math.cos(theta),
        baseY: c.y + r * Math.sin(phi) * Math.sin(theta) * 0.85,
        baseZ: c.z + r * Math.cos(phi),
        color: c.color,
        pulseOffset: Math.random() * Math.PI * 2,
        speed: 1.2 + Math.random() * 2.5
      });
    }

    const ACTIVE_PULSES = [];
    for (let p = 0; p < 18; p++) {
      ACTIVE_PULSES.push({
        sourceIdx: Math.floor(Math.random() * TOTAL_NODES),
        targetIdx: Math.floor(Math.random() * TOTAL_NODES),
        progress: Math.random(),
        speed: 0.008 + Math.random() * 0.012
      });
    }

    let rotY = 0;
    let time = 0;

    function render3DKnowledgeGraph() {
      const rect = cvs.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const fov = 320;

      time += 0.035;
      rotY += 0.007;

      // Base Grid Ring
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy + 62, 115, 34, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.ellipse(cx, cy - 2, 125, 46, -0.22, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0, 255, 170, 0.22)';
      ctx.lineWidth = 1.1;
      ctx.stroke();
      ctx.restore();

      const projected = GRAPH_NODES.map(node => {
        let x1 = node.baseX * Math.cos(rotY) + node.baseZ * Math.sin(rotY);
        let z1 = -node.baseX * Math.sin(rotY) + node.baseZ * Math.cos(rotY);

        let pitch = 0.22;
        let y2 = node.baseY * Math.cos(pitch) - z1 * Math.sin(pitch);
        let z2 = node.baseY * Math.sin(pitch) + z1 * Math.cos(pitch);

        const scale = fov / (fov + z2);
        return {
          x: cx + x1 * scale,
          y: cy + y2 * scale,
          z: z2,
          scale: scale,
          color: node.color,
          speed: node.speed,
          pulseOffset: node.pulseOffset
        };
      });

      // Synaptic Vectors
      for (let i = 0; i < projected.length; i++) {
        for (let j = i + 1; j < projected.length; j++) {
          const dx = projected[i].x - projected[j].x;
          const dy = projected[i].y - projected[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 32) {
            const alpha = (1 - dist / 32) * 0.45;
            let strokeStyle = `rgba(0, 229, 255, ${alpha})`;
            if (projected[i].color === 'green' || projected[j].color === 'green') {
              strokeStyle = `rgba(0, 255, 170, ${alpha * 1.3})`;
            } else if (projected[i].color === 'blue' && projected[j].color === 'blue') {
              strokeStyle = `rgba(0, 140, 255, ${alpha})`;
            }

            ctx.beginPath();
            ctx.moveTo(projected[i].x, projected[i].y);
            ctx.lineTo(projected[j].x, projected[j].y);
            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = 0.85;
            ctx.stroke();
          }
        }
      }

      // Traveling Energy Pulses
      ACTIVE_PULSES.forEach(p => {
        p.progress += p.speed;
        if (p.progress >= 1) {
          p.progress = 0;
          p.sourceIdx = Math.floor(Math.random() * TOTAL_NODES);
          p.targetIdx = Math.floor(Math.random() * TOTAL_NODES);
        }
        const s = projected[p.sourceIdx];
        const t = projected[p.targetIdx];
        if (s && t) {
          const px = s.x + (t.x - s.x) * p.progress;
          const py = s.y + (t.y - s.y) * p.progress;

          ctx.beginPath();
          ctx.arc(px, py, 1.8, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#00ffaa';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      // Render Nodes
      projected.sort((a, b) => b.z - a.z);
      projected.forEach(p => {
        const pulse = Math.sin(time * p.speed + p.pulseOffset) * 0.5 + 0.5;
        const radius = Math.max(1.1, p.scale * (1.8 + pulse * 1.2));

        let col = '#00f0ff';
        let blur = 9;
        if (p.color === 'green') {
          col = '#00ffaa';
          blur = 14;
        } else if (p.color === 'blue') {
          col = '#0099ff';
          blur = 8;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.shadowColor = col;
        ctx.shadowBlur = blur;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Center Core
      ctx.beginPath();
      ctx.ellipse(cx, cy, 22, 10, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.8)';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 24;
      ctx.fill();
      ctx.shadowBlur = 0;

      requestAnimationFrame(render3DKnowledgeGraph);
    }
    render3DKnowledgeGraph();

    const CLUSTER_DATA = [
      { name: "CORE DIRECTIVES", desc: "Hardcoded System Identity & Priority Protocols", vectors: "248,192 EMBEDDINGS // 0.998 COHERENCE", metric: "100%", status: "LOCKED" },
      { name: "EPISODIC CACHE", desc: "Dynamic Conversational & Interaction History", vectors: "419,008 EMBEDDINGS // ACTIVE CONTEXT", metric: "99.4%", status: "SYNCED" },
      { name: "SEMANTIC KNOWLEDGE", desc: "Local Codebase, Schematics & Tool Declarations", vectors: "582,340 EMBEDDINGS // VECTOR DB ONLINE", metric: "98.9%", status: "INDEXED" },
      { name: "TEMPORAL BUFFER", desc: "Short-term Working Memory & Scrap Cache", vectors: "18,420 TOKENS // REFRESH CYCLE 500MS", metric: "NOMINAL", status: "ACTIVE" }
    ];

    const roster = document.getElementById('telemetry-roster');
    CLUSTER_DATA.forEach(cluster => {
      const card = document.createElement('div');
      card.className = 'cluster-card';
      card.innerHTML = `
        <div class="cluster-top">
          <div class="cluster-name-wrap">
            <div class="pulse-node"></div>
            <span class="cluster-name">${cluster.name}</span>
          </div>
          <div class="cluster-meta-right">
            <span class="cluster-status">${cluster.status}</span>
            <span class="cluster-metric">${cluster.metric}</span>
          </div>
        </div>
        <span class="cluster-desc">${cluster.desc}</span>
        <span class="cluster-vector-stat">// ${cluster.vectors}</span>
      `;
      roster.appendChild(card);
    });

    window.addEventListener('wheel', (e) => {
      roster.scrollTop += e.deltaY;
    }, { passive: true });
  </script>
</body>
</html>
