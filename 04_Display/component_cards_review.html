<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON // CINEMATIC CARDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-void: #020408;
            --glass-card: rgba(8, 14, 24, 0.65);
            --glass-border: rgba(140, 210, 255, 0.20);
            --cyan-accent: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.35);
            --text-pure: #ffffff;
            --text-muted: #8ba0b8;
            --font-head: 'Orbitron', monospace;
            --font-ui: 'Chakra Petch', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-void);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-left: 40px;
            font-family: var(--font-ui);
            color: var(--text-pure);
            overflow: hidden;
        }

        .left-metrics-deck {
            width: 375px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .glass-panel {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 0 1px 1px rgba(255, 255, 255, 0.09);
            padding: 18px 22px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 8px;
        }

        .card-title {
            font-family: var(--font-head);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .dots-btn {
            font-size: 10px;
            color: #556882;
            letter-spacing: 2px;
            cursor: pointer;
        }

        /* --- STAGE 1: DEFAULT (Global Overview + Active Agents) --- */
        #overview-swap-stage {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 2.53;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #overview-swap-stage.stage-hidden {
            opacity: 0;
            transform: translateY(-16px) scale(0.96);
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        .card-global { flex: 1.18; display: flex; flex-direction: column; }
        .global-content { display: flex; align-items: center; gap: 18px; flex: 1; }

        .earth-lens-frame {
            width: 114px;
            height: 114px;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 240, 255, 0.4);
            background: radial-gradient(circle at 35% 30%, rgba(0, 240, 255, 0.12) 0%, #01040a 78%);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.22), inset 0 0 18px rgba(0, 0, 0, 0.95);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #earth-3d-canvas { width: 100%; height: 100%; position: absolute; inset: 0; }
        .reticle-ring { position: absolute; inset: 2px; border-radius: 50%; border: 1px dashed rgba(0, 240, 255, 0.25); pointer-events: none; animation: spinReticle 35s linear infinite; }

        .global-stats-table { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .stat-line { display: flex; justify-content: space-between; align-items: center; }
        .stat-line .lbl { font-family: var(--font-ui); font-size: 11px; font-weight: 600; letter-spacing: 1.8px; color: var(--text-muted); text-transform: uppercase; }
        .stat-line .val { font-family: var(--font-mono); font-size: 13.5px; font-weight: 700; letter-spacing: 0.8px; color: #ffffff; }
        .val-amber { color: #fbbf24 !important; font-weight: 700; text-shadow: 0 0 6px rgba(251, 191, 36, 0.5); }
        .val-cyan { color: var(--cyan-accent) !important; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 6px rgba(0, 240, 255, 0.5); }

        .card-agents { flex: 1.35; display: flex; flex-direction: column; }
        .agent-list { display: flex; flex-direction: column; gap: 11px; margin-top: 6px; }
        .agent-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .agent-row:last-child { border-bottom: none; }
        .agent-id { display: flex; align-items: center; gap: 12px; }

        .radar-ring { width: 15px; height: 15px; border-radius: 50%; border: 1.8px solid var(--cyan-accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px rgba(0, 240, 255, 0.5); flex-shrink: 0; }
        .radar-ring::after { content: ''; width: 4.5px; height: 4.5px; background: var(--cyan-accent); border-radius: 50%; }
        .agent-name { font-family: var(--font-ui); font-size: 13px; font-weight: 600; letter-spacing: 1.6px; color: #ffffff; text-transform: uppercase; }
        .agent-status-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--cyan-accent); text-shadow: 0 0 6px rgba(0, 240, 255, 0.4); }

        /* --- STAGE 2: CORTICAL AGENTS MESH (3D BRAIN + REAL ROSTER) --- */
        #agents-cortical-stage {
            flex: 2.53;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transform: translateY(16px) scale(0.96);
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(100% - 150px);
            padding: 16px 20px;
        }

        #agents-cortical-stage.stage-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            position: relative;
        }

        .holo-tag { font-size: 8.5px; letter-spacing: 1px; color: #00ffaa; font-weight: 900; background: rgba(0, 255, 170, 0.15); padding: 2px 7px; border-radius: 2px; border: 1px solid rgba(0, 255, 170, 0.5); box-shadow: 0 0 8px rgba(0, 255, 170, 0.4); }
        .brain-stage { width: 100%; height: 180px; position: relative; flex-shrink: 0; background: radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.16) 0%, rgba(1, 8, 20, 0.5) 70%, transparent 92%); border: 1px solid rgba(0, 229, 255, 0.25); border-radius: 8px; box-shadow: inset 0 0 20px rgba(0, 140, 255, 0.2); overflow: hidden; }
        #brain-canvas { width: 100%; height: 100%; display: block; }
        .agents-scroll-viewport { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 4px; margin-top: 4px; display: flex; flex-direction: column; gap: 7px; max-height: 270px; }
        .agents-scroll-viewport::-webkit-scrollbar { width: 3px; }
        .agents-scroll-viewport::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00ffaa, #00f0ff); border-radius: 2px; }

        .agent-card { display: flex; flex-direction: column; padding: 6px 10px; border-left: 3px solid #00f0ff; background: linear-gradient(90deg, rgba(0, 229, 255, 0.08) 0%, rgba(0, 229, 255, 0.01) 100%); border-bottom: 1px solid rgba(0, 229, 255, 0.15); border-radius: 0 4px 4px 0; flex-shrink: 0; transition: all 0.2s; }
        .agent-card:hover { border-left-color: #00ffaa; background: linear-gradient(90deg, rgba(0, 255, 170, 0.14) 0%, rgba(0, 255, 170, 0.02) 100%); transform: translateX(3px); }
        .agent-top { display: flex; justify-content: space-between; align-items: center; }
        .agent-name-wrap { display: flex; align-items: center; gap: 6px; }
        .beacon-pulse { width: 6px; height: 6px; border-radius: 50%; background: #00ffaa; box-shadow: 0 0 8px #00ffaa; }
        .agent-real-name { font-size: 11.5px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.8); font-family: var(--font-mono); }
        .status-badge { font-size: 8.5px; font-weight: 900; color: #00ffaa; }
        .ping-badge { font-size: 9px; color: #00e5ff; font-family: var(--font-mono); }
        .agent-role { font-size: 9.5px; color: rgba(220, 245, 255, 0.85); margin-top: 2px; }
        .agent-directive { font-size: 8px; color: #7ee8ff; font-family: var(--font-mono); margin-top: 2px; }

        /* --- STAGE 3: ULTRON CORE (PERMANENT) --- */
        .card-core { flex: 1; display: flex; flex-direction: column; margin-top: auto; }
        .core-row { display: flex; align-items: center; gap: 16px; margin-top: 4px; flex: 1; }

        .core-logo-mini svg {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.7));
            flex-shrink: 0;
        }

        .core-frequency-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .audio-wave-monitor {
            width: 100%;
            height: 44px;
            background: rgba(3, 7, 14, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.28);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 240, 255, 0.08);
        }

        #core-wave-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .core-caption-line {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        .pulse-beacon {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--cyan-accent);
            box-shadow: 0 0 8px var(--cyan-accent);
            animation: blinkBeacon 1.2s infinite;
        }

        .core-caption {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #8ba0b8;
            text-transform: uppercase;
        }

        @keyframes spinReticle { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes blinkBeacon { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <main class="left-metrics-deck">
        <!-- 1. DEFAULT: GLOBAL OVERVIEW + ACTIVE AGENTS -->
        <div id="overview-swap-stage">
            <section class="card-global glass-panel">
                <div class="card-header">
                    <span class="card-title">GLOBAL OVERVIEW</span>
                    <span class="dots-btn">•••</span>
                </div>
                <div class="global-content">
                    <div class="earth-lens-frame">
                        <div id="earth-3d-canvas"></div>
                        <div class="reticle-ring"></div>
                    </div>

                    <div class="global-stats-table">
                        <div class="stat-line"><span class="lbl">EARTH</span><span class="val">8.1B</span></div>
                        <div class="stat-line"><span class="lbl">POPULATION</span><span class="val">8.1B</span></div>
                        <div class="stat-line"><span class="lbl">THREAT LEVEL</span><span class="val val-amber">MEDIUM</span></div>
                        <div class="stat-line"><span class="lbl">STATUS</span><span class="val val-cyan">MONITORING</span></div>
                    </div>
                </div>
            </section>

            <section class="card-agents glass-panel">
                <div class="card-header">
                    <span class="card-title">ACTIVE AGENTS</span>
                    <span class="dots-btn">•••</span>
                </div>
                <div class="agent-list">
                    <div class="agent-row">
                        <div class="agent-id"><span class="radar-ring"></span><span class="agent-name">Strategist</span></div>
                        <span class="agent-status-badge">ONLINE</span>
                    </div>
                    <div class="agent-row">
                        <div class="agent-id"><span class="radar-ring"></span><span class="agent-name">Researcher</span></div>
                        <span class="agent-status-badge">ONLINE</span>
                    </div>
                    <div class="agent-row">
                        <div class="agent-id"><span class="radar-ring"></span><span class="agent-name">Security</span></div>
                        <span class="agent-status-badge">ONLINE</span>
                    </div>
                    <div class="agent-row">
                        <div class="agent-id"><span class="radar-ring"></span><span class="agent-name">Evolution</span></div>
                        <span class="agent-status-badge">ONLINE</span>
                    </div>
                </div>
            </section>
        </div>

        <!-- 2. SWAP TARGET: CORTICAL AGENTS MESH -->
        <div id="agents-cortical-stage" class="glass-panel">
            <div class="card-header">
                <span class="card-title">// CORTICAL AGENTS MESH</span>
                <span class="holo-tag">● 8 LOBES ACTIVE</span>
            </div>
            <div class="brain-stage">
                <canvas id="brain-canvas"></canvas>
            </div>
            <div class="agents-scroll-viewport" id="scroll-roster"></div>
        </div>

        <!-- 3. ULTRON CORE -->
        <section class="card-core glass-panel">
            <div class="card-header">
                <span class="card-title">ULTRON CORE</span>
                <span class="dots-btn">•••</span>
            </div>
            <div class="core-row">
                <div class="core-logo-mini">
                    <svg viewBox="0 0 32 32" fill="none">
                        <polygon points="16 3 6 10 16 17 26 10" stroke="#00f0ff" stroke-width="2" stroke-linejoin="round"/>
                        <polyline points="6 22 16 29 26 22" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="6 16 16 23 26 16" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="core-frequency-box">
                    <div class="audio-wave-monitor">
                        <canvas id="core-wave-canvas"></canvas>
                    </div>
                    <div class="core-caption-line">
                        <span class="pulse-beacon"></span>
                        <span class="core-caption">Processing...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

        <script>
        const overviewStage = document.getElementById('overview-swap-stage');
        const corticalStage = document.getElementById('agents-cortical-stage');

        function setAgentsView(show) {
            if (!overviewStage || !corticalStage) return;
            if (show) {
                overviewStage.classList.add('stage-hidden');
                corticalStage.classList.add('stage-active');
            } else {
                overviewStage.classList.remove('stage-hidden');
                corticalStage.classList.remove('stage-active');
            }
        }

        // Direct & Robust Message Listener for Home & Agents
        window.addEventListener('message', (e) => {
            if (!e.data) return;
            const target = (e.data.target || e.data.action || '').toUpperCase();
            const type = (e.data.type || '').toUpperCase();

            if (type === 'NAV_CLICK' || e.data.target) {
                if (target === 'AGENTS') {
                    setAgentsView(true);
                } else if (target === 'HOME') {
                    setAgentsView(false);
                }
            }
        });
    </script>
</body>
</html>
</html>
