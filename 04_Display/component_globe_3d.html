<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON // 4D QUANTUM EARTH HOLOGRAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-dark: #020408;
            --cyan-glow: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.25);
            --card-glass: rgba(10, 16, 26, 0.75);
            --card-border: rgba(140, 210, 255, 0.22);
            --font-head: 'Orbitron', monospace;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Chakra Petch', sans-serif;
            overflow: hidden;
        }

        /* Sci-Fi Hologram Showcase Container */
        .holo-stage-deck {
            position: relative;
            width: 480px;
            height: 520px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 1px 1px rgba(255,255,255,0.1), 0 0 30px rgba(0, 240, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px;
        }

        .deck-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .deck-title {
            font-family: var(--font-head);
            font-size: 12px;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .status-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--cyan-glow);
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid rgba(0, 240, 255, 0.35);
            padding: 3px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--cyan-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan-glow);
            animation: pulse 1.5s infinite;
        }

        /* 3D WebGL Viewport */
        .globe-3d-viewport {
            width: 100%;
            flex: 1;
            position: relative;
            cursor: grab;
        }
        .globe-3d-viewport:active { cursor: grabbing; }

        /* Tactical Telemetry HUD Tags */
        .hud-bracket {
            position: absolute;
            font-family: var(--font-mono);
            font-size: 9.5px;
            letter-spacing: 1.5px;
            color: #7dd3fc;
            pointer-events: none;
        }
        .b-top-left { top: 15px; left: 10px; }
        .b-top-right { top: 15px; right: 10px; text-align: right; }
        .b-bottom { bottom: 10px; font-size: 10px; color: rgba(255, 255, 255, 0.5); letter-spacing: 2px; }

        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
    </style>
</head>
<body>

    <div class="holo-stage-deck">
        <div class="deck-header">
            <span class="deck-title">TERRA // QUANTUM HOLOGRAM</span>
            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span>REAL-TIME 3D FEED</span>
            </div>
        </div>

        <div id="globe-viewport" class="globe-3d-viewport">
            <div class="hud-bracket b-top-left">SECTOR: SOL-03<br>SCAN: 4D PHASE MATRIX</div>
            <div class="hud-bracket b-top-right">ELEVATION: 420 KM<br>SURFACE RES: 0.05 MM</div>
            <div class="hud-bracket b-bottom">[ CLICK & DRAG TO ROTATE PLANETARY CORE ]</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('globe-viewport');
        const width = container.clientWidth;
        const height = container.clientHeight;

        // Scene & Camera
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
        camera.position.z = 260;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Core Group
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // 1. Inner Luminous Core
        const coreGeo = new THREE.SphereGeometry(62, 36, 36);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0x021122,
            transparent: true,
            opacity: 0.85
        });
        const innerCore = new THREE.Mesh(coreGeo, coreMat);
        earthGroup.add(innerCore);

        // 2. Latitude / Longitude Geodesic Wireframe
        const wireGeo = new THREE.SphereGeometry(62.5, 24, 18);
        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            wireframe: true,
            transparent: true,
            opacity: 0.28
        });
        const wireMesh = new THREE.Mesh(wireGeo, wireMat);
        earthGroup.add(wireMesh);

        // 3. Dense Atmospheric Particle Cloud (Continent Sim)
        const particleCount = 2200;
        const pGeo = new THREE.BufferGeometry();
        const pPositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / particleCount);
            const theta = Math.sqrt(particleCount * Math.PI) * phi;
            const r = 63.5 + (Math.random() * 1.5);

            pPositions[i * 3] = r * Math.cos(theta) * Math.sin(phi);
            pPositions[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
            pPositions[i * 3 + 2] = r * Math.cos(phi);
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        const pMat = new THREE.PointsMaterial({
            color: 0x38bdf8,
            size: 1.8,
            transparent: true,
            opacity: 0.85
        });
        const earthParticles = new THREE.Points(pGeo, pMat);
        earthGroup.add(earthParticles);

        // 4. Orbital Ring 1 (Equatorial Scan Line)
        const ring1Geo = new THREE.RingGeometry(76, 76.8, 64);
        const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        ring1.rotation.x = Math.PI / 2;
        earthGroup.add(ring1);

        // 5. Orbital Ring 2 (Polar Orbit)
        const ring2Geo = new THREE.RingGeometry(82, 82.6, 64);
        const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.y = Math.PI / 3;
        earthGroup.add(ring2);

        // 6. Orbiting Satellites (Glowing Pulse Beacons)
        const sat1 = new THREE.Mesh(
            new THREE.SphereGeometry(1.8, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        scene.add(sat1);

        const sat2 = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0x00f0ff })
        );
        scene.add(sat2);

        // 7. 4D Temporal Vertical Scan Wave
        const scanRingGeo = new THREE.RingGeometry(0, 64, 64);
        const scanRingMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.25
        });
        const scanWave = new THREE.Mesh(scanRingGeo, scanRingMat);
        scanWave.rotation.x = Math.PI / 2;
        earthGroup.add(scanWave);

        // Mouse Drag / Interaction Logic
        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - prevMousePos.x;
            const deltaY = e.clientY - prevMousePos.y;

            earthGroup.rotation.y += deltaX * 0.006;
            earthGroup.rotation.x += deltaY * 0.006;

            prevMousePos = { x: e.clientX, y: e.clientY };
        });

        // Resize
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // Animation Loop
        let angle1 = 0;
        let angle2 = Math.PI;
        let scanY = -60;

        function animate() {
            requestAnimationFrame(animate);

            // Natural planetary rotation
            if (!isDragging) {
                earthGroup.rotation.y += 0.004;
            }

            // Orbital Ring Counter-Rotation
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.005;

            // Satellite Trajectory
            angle1 += 0.025;
            sat1.position.x = Math.cos(angle1) * 76.4;
            sat1.position.z = Math.sin(angle1) * 76.4;
            sat1.position.y = Math.sin(angle1 * 0.5) * 8;

            angle2 += 0.018;
            sat2.position.x = Math.cos(angle2) * 82.3 * Math.cos(Math.PI / 3);
            sat2.position.y = Math.sin(angle2) * 82.3;
            sat2.position.z = Math.cos(angle2) * 82.3 * Math.sin(Math.PI / 3);

            // 4D Scan Wave Pulse Up and Down
            scanY += 0.6;
            if (scanY > 60) scanY = -60;
            scanWave.position.y = scanY;
            const factor = 1 - Math.abs(scanY) / 60;
            scanWave.scale.set(factor, factor, factor);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
