<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultron Intelligence Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden !important;
      font-family: 'Oxanium', monospace, sans-serif;
      color: #00e5ff;
    }

    .intelligence-container {
      width: 275px !important;
      padding: 6px 20px 6px 2px !important;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .matrix-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 229, 255, 0.35);
      padding-bottom: 6px;
      width: 100%;
    }

    .matrix-title {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
      text-transform: uppercase;
    }

    .matrix-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 1px;
      color: #00ffaa;
      background: rgba(0, 255, 170, 0.12);
      border: 1px solid rgba(0, 255, 170, 0.45);
      padding: 2px 6px;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(0, 255, 170, 0.3);
    }

    /* 3D Holographic Stage */
    .orbital-stage {
      width: 100%;
      height: 175px;
      position: relative;
      border-radius: 8px;
      border: 1px solid rgba(0, 229, 255, 0.15);
      background: radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.1) 0%, transparent 75%);
      box-shadow: inset 0 0 25px rgba(0, 229, 255, 0.08);
      overflow: hidden;
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Telemetry Data Section */
    .telemetry-section {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
      padding-right: 6px;
    }

    .telemetry-header {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #8daec7;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 3px 0;
      border-bottom: 1px dashed rgba(0, 229, 255, 0.18);
    }

    .telemetry-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.1px;
      color: #a1c4db;
      text-transform: uppercase;
      flex: 1;
      white-space: nowrap;
    }

    .telemetry-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1.2px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.85);
      text-align: right;
      flex-shrink: 0;
    }

    .status-converged {
      color: #00ffaa !important;
      text-shadow: 0 0 10px rgba(0, 255, 170, 0.9) !important;
      font-weight: 700;
    }

    .metric-progress-track {
      width: 100%;
      height: 3px;
      background: rgba(0, 229, 255, 0.18);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }

    .metric-progress-bar {
      height: 100%;
      width: 85%;
      background: linear-gradient(90deg, #0088ff, #00f0ff);
      box-shadow: 0 0 10px #00f0ff;
      animation: pulseBar 2.5s infinite ease-in-out alternate;
    }

    @keyframes pulseBar {
      0% { width: 70%; }
      100% { width: 95%; }
    }
  </style>
</head>
<body>

  <div class="intelligence-container">
    <div class="matrix-header">
      <span class="matrix-title">// Quantum Reasoning Matrix</span>
      <span class="matrix-badge">18K RES</span>
    </div>

    <!-- 3D Holographic Neural Core -->
    <div class="orbital-stage">
      <div id="three-canvas"></div>
    </div>

    <!-- Clear, Readable Telemetry Rows -->
    <div class="telemetry-section">
      <div class="telemetry-header">Synapse Vector Slots</div>
      
      <div class="telemetry-row">
        <span class="telemetry-label">Cognitive Heuristic Flux</span>
        <span class="telemetry-value">0.9998</span>
      </div>

      <div class="telemetry-row">
        <span class="telemetry-label">Inference Stream</span>
        <span class="telemetry-value">14.8 TH/s</span>
      </div>

      <div class="telemetry-row">
        <span class="telemetry-label">Neural Weight Alignment</span>
        <span class="telemetry-value status-converged">CONVERGED</span>
      </div>

      <div class="metric-progress-track">
        <div class="metric-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Three.js 3D Holographic Neural Core
    const container = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 5.8;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    // Core Wireframe Icosahedron
    const icoGeo = new THREE.IcosahedronGeometry(1.25, 1);
    const icoMat = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      wireframe: true,
      transparent: true,
      opacity: 0.85
    });
    const coreMesh = new THREE.Mesh(icoGeo, icoMat);
    group.add(coreMesh);

    // Inner Glowing Core
    const innerGeo = new THREE.SphereGeometry(0.5, 16, 16);
    const innerMat = new THREE.MeshBasicMaterial({
      color: 0x00ffaa,
      wireframe: true,
      transparent: true,
      opacity: 0.9
    });
    const innerCore = new THREE.Mesh(innerGeo, innerMat);
    group.add(innerCore);

    // Orbital Elliptical Rings
    function createOrbitRing(radiusX, radiusY, rotX, rotY, color) {
      const curve = new THREE.EllipseCurve(0, 0, radiusX, radiusY, 0, 2 * Math.PI, false, 0);
      const points = curve.getPoints(64);
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.65 });
      const ring = new THREE.Line(geometry, material);
      ring.rotation.x = rotX;
      ring.rotation.y = rotY;
      return ring;
    }

    const ring1 = createOrbitRing(2.3, 1.2, Math.PI / 3, Math.PI / 6, 0x00e5ff);
    const ring2 = createOrbitRing(2.4, 1.1, -Math.PI / 4, Math.PI / 4, 0x00ffaa);
    const ring3 = createOrbitRing(2.2, 0.9, Math.PI / 2.2, 0, 0x0088ff);
    group.add(ring1);
    group.add(ring2);
    group.add(ring3);

    // Floating Synapse Particles
    const partGeo = new THREE.BufferGeometry();
    const partCount = 70;
    const posArray = new Float32Array(partCount * 3);
    for(let i = 0; i < partCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 4.2;
    }
    partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const partMat = new THREE.PointsMaterial({
      size: 0.05,
      color: 0x00ffff,
      transparent: true,
      opacity: 0.8
    });
    const particles = new THREE.Points(partGeo, partMat);
    group.add(particles);

    function animate() {
      requestAnimationFrame(animate);
      coreMesh.rotation.x += 0.008;
      coreMesh.rotation.y += 0.012;
      innerCore.rotation.y -= 0.015;
      ring1.rotation.z += 0.007;
      ring2.rotation.z -= 0.009;
      ring3.rotation.y += 0.006;
      particles.rotation.y += 0.003;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      if (!container.clientWidth || !container.clientHeight) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
